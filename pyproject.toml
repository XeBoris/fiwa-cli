[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiwa-cli"
version = "0.2.0"
description = "Financial Workflow Application CLI"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Boris Bauermeister", email = "Boris.Bauermeister@gmail.com"}
]
keywords = ["finance", "workflow", "cli", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Core dependencies (always installed)
dependencies = [
    "textual",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
# Development dependencies (installed with: pip install fiwa-cli[dev])
dev = [
    "textual[syntax]",
    "textual-dev",
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "faker",
]

# Syntax highlighting only (installed with: pip install fiwa-cli[syntax])
syntax = [
    "textual[syntax]",
]

[project.scripts]
fiwa = "fiwa_cli.main:main"

[project.urls]
Homepage = "https://github.com/Boris-Bauermeister/fiwa-cli"
Repository = "https://github.com/Boris-Bauermeister/fiwa-cli"

[tool.setuptools]
# Use automatic package discovery with src-layout
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fiwa_cli*"]

[tool.setuptools.package-data]
# Include main.tcss at the fiwa_cli package root
"fiwa_cli" = ["main.tcss"]
# Include all TCSS/CSS files in the css.handsome subpackage
"fiwa_cli.css.handsome" = ["*.tcss", "*.css"]
# Include SQL files in database package
"fiwa_cli.database" = ["*.sql"]

