# Documentation Build and Deploy Workflow
name: Build Documentation

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-docs:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build HTML documentation
      run: |
        cd docs
        make html
        echo ""
        echo "✓ Documentation built successfully!"
        echo "  Output: docs/build/html/"

    - name: Check for build warnings
      run: |
        if [ -f docs/build/warnings.txt ]; then
          echo "⚠️  Documentation warnings:"
          cat docs/build/warnings.txt
        else
          echo "✓ No documentation warnings"
        fi

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation-html
        path: docs/build/html/
        retention-days: 30

    - name: Summary
      if: always()
      run: |
        echo "========================================="
        echo "Documentation Build Complete"
        echo "========================================="
        echo "✓ Sphinx HTML documentation generated"
        echo "✓ Artifact uploaded (available for 30 days)"
        echo ""
        echo "Download the artifact from Actions tab to view locally."

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme sphinx_autodoc_typehints
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build/html
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Summary
      if: always()
      run: |
        echo "========================================="
        echo "Documentation Deployed to GitHub Pages"
        echo "========================================="
        echo "✓ Documentation published to gh-pages branch"
        echo "✓ Available at: https://<username>.github.io/<repo>/"
        echo ""
        echo "Enable GitHub Pages in repository settings if not already enabled:"
        echo "  Settings → Pages → Source: Deploy from branch 'gh-pages'"
