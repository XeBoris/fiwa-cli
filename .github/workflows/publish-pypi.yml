# Publish Package to PyPI Workflow
name: Publish to PyPI

on:
  release:
    types:
      - published  # Trigger only when a GitHub Release is published (tag-based)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-release-tag:
    name: Validate release tag format
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.tag_check.outputs.should_run }}
    steps:
    - name: Check release tag pattern
      id: tag_check
      run: |
        TAG="${{ github.event.release.tag_name }}"
        if [[ "$TAG" =~ ^l[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' matches required format lX.X.X"
        else
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' does not match required format lX.X.X"
        fi

  build-and-publish:
    name: Build and Publish to PyPI
    needs: validate-release-tag
    if: ${{ needs.validate-release-tag.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      id-token: write  # Required for trusted publishing (optional)

    steps:
    - name: Checkout released tag
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0  # Fetch all history to access tags

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract version from pyproject.toml
      id: get_version
      run: |
        # Extract version using Python
        VERSION=$(python -c "
        try:
            import tomllib
        except ImportError:
            import tomli as tomllib
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
            print(data['project']['version'])
        ")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✓ Version: $VERSION"

    - name: Verify package metadata
      run: |
        echo "========================================="
        echo "Package Information"
        echo "========================================="
        python -c "
        try:
            import tomllib
        except ImportError:
            import tomli as tomllib
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
            print(f\"Name: {data['project']['name']}\")
            print(f\"Version: {data['project']['version']}\")
            print(f\"Description: {data['project']['description']}\")
            print(f\"Author: {data['project']['authors'][0]['name']}\")
        "

    - name: Clean previous builds
      run: |
        echo "Cleaning previous builds..."
        rm -rf build/ dist/ *.egg-info
        echo "✓ Clean complete"

    - name: Build package
      run: |
        echo "Building package..."
        python -m build
        echo ""
        echo "✓ Package built successfully!"
        echo ""
        echo "Built files:"
        ls -lh dist/

    - name: Check package with twine
      run: |
        echo "Checking package with twine..."
        twine check dist/*
        echo "✓ Package check passed"

#    - name: Publish to Test PyPI (dry run)
#      env:
#        TWINE_USERNAME: __token__
#        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
#      run: |
#        echo "========================================="
#        echo "Publishing to Test PyPI (dry run)"
#        echo "========================================="
#        if [ -z "$TWINE_PASSWORD" ]; then
#          echo "⚠️  TEST_PYPI_API_TOKEN not set - skipping Test PyPI upload"
#          echo "   To enable: Add TEST_PYPI_API_TOKEN to repository secrets"
#        else
#          twine upload --repository testpypi dist/* --verbose || echo "⚠️  Test PyPI upload failed or already exists"
#        fi

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_FIWA_CLI_API_TOKEN }}
      run: |
        echo "========================================="
        echo "Publishing to PyPI"
        echo "========================================="
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "❌ PYPI_FIWA_CLI_API_TOKEN not set!"
          echo "   Cannot publish to PyPI without token."
          echo ""
          echo "To publish to PyPI:"
          echo "  1. Create API token at https://pypi.org/manage/account/token/"
          echo "  2. Add as repository secret: PYPI_FIWA_CLI_API_TOKEN"
          echo "  3. Re-run this workflow"
          exit 1
        else
          twine upload dist/* --verbose
          echo ""
          echo "✓ Package published to PyPI successfully!"
          echo "  Package: fiwa-cli"
          echo "  Version: ${{ steps.get_version.outputs.version }}"
          echo ""
          echo "Install with: pip install fiwa-cli"
        fi

    - name: Summary
      if: always()
      run: |
        echo "========================================="
        echo "PyPI Publication Complete"
        echo "========================================="
        echo "Release tag: ${{ github.event.release.tag_name }}"
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo ""
        echo "✓ Package built and published to PyPI"
        echo "✓ Triggered from published GitHub Release"
        echo ""
        echo "Next steps:"
        echo "  1. Verify package on PyPI: https://pypi.org/project/fiwa-cli/"
        echo "  2. Test installation: pip install fiwa-cli"
        echo "  3. Verify release assets and notes on GitHub"
